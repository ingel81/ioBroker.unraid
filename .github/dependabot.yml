# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '40 2 18 * *'
    open-pull-requests-limit: 15
    assignees:
      - 'ingel81'
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      # Typings must match the minimum supported node version (22), see repochecker W0066/W8917
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # The admin UI follows what @iobroker/adapter-react-v5 declares as its peers:
      # react/react-dom ^18.3.1 and @mui/material ^6.5.0. Major bumps beyond that
      # cannot be installed (npm ERESOLVE). React 19 slipped in through an automated
      # update once and had to be reverted. Revisit when adapter-react-v5 moves on.
      - dependency-name: '@mui/*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react-dom'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/react-dom'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '40 2 18 * *'
    open-pull-requests-limit: 15
    assignees:
      - 'ingel81'
